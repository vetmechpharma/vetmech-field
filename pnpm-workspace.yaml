minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  sharp: true
  unrs-resolver: true
  mongodb-memory-server: false

verifyDepsBeforeRun: false

# Patched compatible transitive releases; keep the seven-day release-age gate.
overrides:
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.28
  fast-uri: 3.1.9
  js-yaml@4: 4.3.2
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12

  follow-redirects: 1.16.1
  undici@8: 8.12.2

# Exact reviewed security patches may bypass the seven-day age gate.
minimumReleaseAgeExclude:
  - nodemailer@10.1.4
  - fast-uri@3.1.9
  - follow-redirects@1.16.1
  - undici@8.12.2
