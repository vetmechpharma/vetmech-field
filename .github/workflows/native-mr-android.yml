name: Build native VETMECH MR APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/native-mr-android.yml'
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Check types
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Generate Android project
        working-directory: mobile
        run: CI=1 npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VETMECH-MR-NATIVE-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
