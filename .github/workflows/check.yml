name: Build and MongoDB integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      # Temporary branch-only lock refresh; no repository write token.
      - run: pnpm install --no-frozen-lockfile
      - name: Return resolved lockfile
        run: node -e "console.log('VETMECH_RESOLVED_LOCK='+JSON.stringify(require('fs').readFileSync('pnpm-lock.yaml','utf8')))"
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - run: pnpm test:security
      - run: pnpm test:domain
      - run: pnpm audit --audit-level=low
      # Uses an isolated temporary replica set and synthetic test data only.
      - run: pnpm test:mongo
      - run: pnpm test:ui
      - run: pnpm build
